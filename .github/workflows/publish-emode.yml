name: Publish emode to PyPI

# Publishes the `emode` distribution (packaging/emode) on an `emode-v*` tag via
# PyPI Trusted Publishing (OIDC), as publish.yml does for emodeconnection.
#
# One-time setup on pypi.org before the first run, as a pending publisher
# under the account's Publishing settings (the project does not exist until
# the first upload creates it):
#   Project name: emode
#   Owner:        emode-photonix
#   Repository:   emodeconnection
#   Workflow:     publish-emode.yml
#   Environment:  pypi

on:
  push:
    tags: ['emode-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build packaging/emode --out-dir dist

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          VERSION=$(python -c "
          import tomllib
          with open('packaging/emode/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG" != "emode-v${VERSION}" ]; then
            echo "error: tag ${TAG} does not match packaging/emode version ${VERSION}" >&2
            exit 1
          fi
          echo "Publishing ${TAG}"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-emode
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # The environment PyPI's trusted publisher is scoped to.
    environment: pypi

    permissions:
      # Required for OIDC; this is what replaces the API token.
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-emode
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
