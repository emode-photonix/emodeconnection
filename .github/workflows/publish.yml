name: Publish emodeconnection to PyPI

# Publishes the `emodeconnection` shim (packaging/emodeconnection, which depends
# on `emode` and re-exports it) on an `emodeconnection-v*` tag via PyPI Trusted
# Publishing (OIDC). Publish emode first (publish-emode.yml, tag `v*`), since
# the shim depends on it.
#
# The trusted publisher of the emodeconnection project on pypi.org names this
# workflow:
#   Owner:        emode-photonix
#   Repository:   emodeconnection
#   Workflow:     publish.yml
#   Environment:  pypi

on:
  push:
    tags: ['emodeconnection-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build packaging/emodeconnection --out-dir dist

      - name: Check the tag matches the packaged version
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          VERSION=$(python -c "
          import tomllib
          with open('packaging/emodeconnection/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG" != "emodeconnection-v${VERSION}" ]; then
            echo "error: tag ${TAG} does not match packaging/emodeconnection version ${VERSION}" >&2
            exit 1
          fi
          echo "Publishing ${TAG}"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # The environment PyPI's trusted publisher is scoped to.
    environment: pypi

    permissions:
      # Required for OIDC; this is what replaces the API token.
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
