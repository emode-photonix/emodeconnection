name: Tests

# The tests under tests/ run without a solver install or a license: they
# exercise the client on its own (process launch, stdout forwarding). Anything
# that crosses the wire is still validated against the solver, outside this
# repository.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the tests
        # --python is explicit because .python-version predates the package's
        # requires-python and names an older interpreter.
        run: uv run --python 3.12 --group dev pytest tests/

      - name: Run the tests under the old name
        # The same suite with every import spelled emodeconnection, through the shim.
        run: uv run --python 3.12 --group dev sh tests/run_under_old_name.sh

      - name: Build both distributions
        run: |
          uv build --out-dir dist
          uv build packaging/emodeconnection --out-dir dist
