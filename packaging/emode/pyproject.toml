[project]
name = "emode"
version = "0.1.0"
description = "Python interface for EMode, under its short name"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
  "emodeconnection>=1.1.25",
]
authors = [
  { name = "EMode, Inc.", email = "hello@emodephotonix.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://emodephotonix.com"
Documentation = "https://docs.emodephotonix.com"
Source = "https://github.com/emode-photonix/emodeconnection"

[project.optional-dependencies]
# The MCP server (emode-mcp), as in emodeconnection.
mcp = ["emodeconnection[mcp]>=1.1.25"]

[build-system]
requires = ["hatchling>=1.11.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emode"]

[tool.hatch.build.targets.sdist]
include = ["src/emode", "README.md", "LICENSE", "pyproject.toml"]
