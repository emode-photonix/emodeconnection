[project]
name = "emodeconnection"
version = "1.1.26"
description = "The old name of the emode package. Installs emode."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
  "emode>=1.1.26",
]
authors = [
  { name = "EMode, Inc.", email = "hello@emodephotonix.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Development Status :: 7 - Inactive",
]

[project.urls]
Homepage = "https://emodephotonix.com"
Documentation = "https://docs.emodephotonix.com"
Source = "https://github.com/emode-photonix/emodeconnection"

[project.optional-dependencies]
# The MCP server. emode-mcp comes from emode.
mcp = ["emode[mcp]>=1.1.26"]

[build-system]
requires = ["hatchling>=1.11.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emodeconnection"]

[tool.hatch.build.targets.sdist]
include = ["src/emodeconnection", "README.md", "LICENSE", "pyproject.toml"]
