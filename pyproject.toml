[project]
name = "emode"
version = "1.1.26"
description = "Python client for EMode"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "dill",
  "scipy",
  "pydantic>=2.11.4",
  "requests",
]
authors = [
  { name = "EMode, Inc.", email = "hello@emodephotonix.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://emodephotonix.com"
Documentation = "https://docs.emodephotonix.com"
Source = "https://github.com/emode-photonix/emodeconnection"

[project.optional-dependencies]
# The MCP server (emode-mcp). The base client does not depend on it.
mcp = ["mcp==2.3.0"]

[project.scripts]
emode-install = "emode.installer:main"
emode-mcp = "emode.mcp:main"

[dependency-groups]
dev = [
  "pytest",
  "mcp==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["emode"]

[build-system]
requires = ["hatchling>=1.11.0"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.10"
strictParameterNoneValue = false
reportMissingTypeArgument = false
reportAny = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportMissingParameterType = false
reportUnusedCallResult = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
reportImplicitOverride = false
reportUnnecessaryIsInstance = false
