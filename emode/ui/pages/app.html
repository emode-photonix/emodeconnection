<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>EMode</title>
<link rel="stylesheet" href="static/emode.css">
<script src="static/plotly-cartesian.min.js" defer></script>
<script src="static/app.js" defer></script>
</head>
<body>
<header id="nav">
  <span class="brand">EMode</span>
  <a href="#/plots" class="tab" data-route="plots">Plots</a>
  <a href="#/session" class="tab" data-route="session">Session</a>
  <a id="docs" href="https://docs.emodephotonix.com/" target="_blank" rel="noopener noreferrer" class="tab">Docs</a>
  <span id="status" role="status"></span>
</header>
<main id="app">
  <aside id="list" aria-label="Plots of this session"><ol id="views"></ol></aside>
  <section id="panel">
    <div id="controls"></div>
    <div id="message" role="alert" hidden></div>
    <div id="stage">
      <div id="figure"></div>
      <aside id="layer-panel" aria-label="GDS layers" hidden></aside>
    </div>
  </section>
</main>
<main id="session" hidden>
  <h2>This session</h2>
  <div id="session-message" role="status" hidden></div>
  <table id="session-table"></table>
</main>
</body>
</html>
